name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
      - name: Replay current M0 fixture
        run: >-
          python -m pipe_twin analyze
          --manifest test_model/manifest.json
          --output outputs/current_demo_report.json
      - name: Generate pipe-group2 synthetic stereo fixture
        run: >-
          python -m pipe_twin simulate-stereo
          --manifest test_model/pipe_group2_manifest.json
          --output-dir outputs/pipe_group2_synthetic_stereo
      - name: Analyze field stereo software demo
        run: >-
          python -m pipe_twin analyze-stereo
          --manifest test_model/field_stereo_demo_manifest.json
          --output outputs/field_stereo_demo_report.json
